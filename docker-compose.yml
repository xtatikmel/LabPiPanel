services:
  labpipanel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labpipanel
    hostname: labpipanel
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      HOST: 0.0.0.0
      PORT: 5000
      PYTHONUNBUFFERED: "1"

    volumes:
      # Grabaciones persistentes
      - ./apps/backend/recordings:/app/apps/backend/recordings

      # Raspberry Pi: descomentar para DAQ USB y GPIO
      # - /dev/bus/usb:/dev/bus/usb
      # - /sys/class/gpio:/sys/class/gpio

    # Raspberry Pi: descomentar si se accede a GPIO/USB
    # devices:
    #   - /dev/mem:/dev/mem
    #   - /dev/gpiomem:/dev/gpiomem
    # privileged: true

    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/status', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
